title: Password Reset Followed by Finance Privilege Group Addition
id: 37dbce55-f85e-45a6-a426-5bb4c57b6e8e
status: experimental
description: >-
  Detects a Windows account password reset followed by addition of the same
  account to the Finance-Admins-Lab global security group within 30 minutes.
  This rule is designed for the controlled Windows identity correlation lab
  and requires backend field mapping and validation before wider use.
references:
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4724
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/audit-security-group-management
  - https://sigmahq.io/sigma-specification/specification/sigma-correlation-rules-specification.html
author: theluckydraco-stack
date: 2026-07-29
correlation:
  type: temporal_ordered
  rules:
    - password_reset
    - finance_group_add
  group-by:
    - account_sid
  timespan: 30m
  aliases:
    account_sid:
      password_reset: TargetSid
      finance_group_add: MemberSid
falsepositives:
  - Approved account recovery followed by a documented role change
  - The controlled Windows identity correlation lab
level: high
---
title: Windows Account Password Reset
id: 6b2bda76-7cda-4ba4-a88a-6be21c88ef7f
name: password_reset
description: Detects Windows Security Event 4724 for an account password reset attempt.
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4724
  condition: selection
---
title: Account Added to Finance Admins Lab Group
id: f2644a25-bd1a-4d8e-9cbb-4d3d63b4fc79
name: finance_group_add
description: >-
  Detects a member being added to the Finance-Admins-Lab security-enabled
  global group through Windows Security Event 4728.
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4728
    TargetUserName: Finance-Admins-Lab
  condition: selection
